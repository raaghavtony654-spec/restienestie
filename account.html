<style>
    .account-container {
        padding: 150px 5% 50px 5%;
        max-width: 1200px;
        margin: 0 auto;
        min-height: 80vh;
    }
    .auth-section, .dashboard-section {
        display: none;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .active-section {
        display: block;
    }
    .auth-box {
        max-width: 400px;
        margin: 0 auto;
        text-align: center;
    }
    .auth-box h2 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        color: #333;
    }
    .input-group {
        margin-bottom: 1rem;
        text-align: left;
    }
    .input-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        color: #4B3621;
        font-weight: 600;
    }
    .input-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: 'Inter', sans-serif;
        transition: border-color 0.3s ease, background 0.3s ease;
    }
    .input-group input:invalid:not(:placeholder-shown) {
        border-color: #ffcccc;
        background: rgba(255, 235, 238, 0.6);
    }
    .input-group input:valid:not(:placeholder-shown) {
        border-color: #c8e6c9;
        background: rgba(232, 245, 233, 0.6);
    }
    .btn-primary {
        width: 100%;
        padding: 0.8rem;
        background-color: #A67C52;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        transition: background 0.3s ease;
    }
    .btn-primary:hover {
        background-color: #8c6844;
    }
    .btn-secondary {
        width: 100%;
        padding: 0.8rem;
        background-color: #fff;
        color: #333;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        margin-top: 10px;
    }
    .toggle-auth {
        margin-top: 1rem;
        font-size: 0.9rem;
        cursor: pointer;
        color: #A67C52;
        text-decoration: underline;
    }
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 2rem;
    }
    .profile-card, .orders-card {
        background: #fff;
        padding: 1.5rem;
        border-radius: 8px;
        border: 1px solid #eee;
    }
    .profile-card h3, .orders-card h3 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.8rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid #eee;
        padding-bottom: 0.5rem;
    }
    .order-item {
        padding: 1rem 0;
        border-bottom: 1px solid #eee;
    }
    .order-item:last-child {
        border-bottom: none;
    }
    .order-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
    }
    .order-status {
        background: #eee;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 500;
    }
    .btn-logout {
        background: transparent;
        border: 1px solid #A67C52;
        color: #A67C52;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        margin-top: 1rem;
    }
    /* ----- Status Messages ----- */
    .status-msg {
        display: none;
        padding: 0.85rem 1rem;
        margin-bottom: 1.25rem;
        border-radius: 8px;
        text-align: center;
        font-weight: 500;
        font-size: 0.9rem;
        animation: status-in 0.35s ease;
        font-family: 'Inter', sans-serif;
    }
    @keyframes status-in {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .status-success {
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
        color: #2e7d32;
        border: 1px solid #c8e6c9;
    }
    .status-error {
        background: linear-gradient(135deg, #ffebee, #fce4ec);
        color: #c62828;
        border: 1px solid #ffcdd2;
    }
    .status-loading {
        background: linear-gradient(135deg, #e3f2fd, #e8eaf6);
        color: #1565c0;
        border: 1px solid #bbdefb;
    }
    
    .profile-form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    @media (max-width: 768px) {
        .dashboard-grid {
            grid-template-columns: 1fr;
        }
        .profile-form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

    <!-- Simple Page Loader -->
    <style>
        .page-loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FAF9F6; z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow: hidden;
        }
        .page-loader-overlay.active {
            opacity: 1; visibility: visible; pointer-events: all;
        }
        
        .loader-scene {
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* 3D Hole setup */
        .loader-hole-back {
            position: absolute;
            width: 70px;
            height: 18px;
            background: #2A1D11;
            border-radius: 50%;
            top: 155px;
            left: 120px;
            z-index: 5;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        }
        .loader-hole-front {
            position: absolute;
            width: 70px;
            height: 18px;
            background: #2A1D11;
            border-radius: 50%;
            top: 155px;
            left: 120px;
            z-index: 15;
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }
        .loader-floor-mask {
            position: absolute;
            width: 100%;
            height: 400px;
            background: #FAF9F6;
            top: 164px; /* exact vertical center of the hole */
            left: 0;
            z-index: 14;
        }

        /* Bed */
        .loader-bed {
            position: absolute;
            width: 100px;
            height: 22px;
            background: #4B3621;
            border-radius: 4px;
            top: 120px;
            left: 20px;
            z-index: 8;
            box-shadow: 0 4px 10px rgba(75, 54, 33, 0.2);
        }
        /* Bed Legs */
        .loader-bed::before, .loader-bed::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 16px;
            background: #3a2818;
            top: 22px;
            border-radius: 2px;
        }
        .loader-bed::before { left: 10px; }
        .loader-bed::after { right: 10px; }
        
        /* Headboard */
        .loader-bed-headboard {
            position: absolute;
            width: 12px;
            height: 40px;
            background: #4B3621;
            top: 102px;
            left: 14px;
            z-index: 7;
            border-radius: 4px 4px 0 0;
        }

        /* Mattress */
        .loader-mattress {
            position: absolute;
            width: 90px;
            height: 18px;
            background: #E8E2DA;
            border: 2px solid #c4a173;
            border-radius: 6px;
            top: 100px;
            left: 25px;
            z-index: 10;
            box-sizing: border-box;
            box-shadow: inset 0 -3px 0 rgba(139, 115, 85, 0.2);
        }

        .mattress-1 {
            animation: mattress-cycle 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mattress-2 {
            animation: mattress-cycle 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1) -1.2s;
        }

        @keyframes mattress-cycle {
            0%, 10% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            20% {
                transform: translate(30px, -40px) rotate(50deg);
                opacity: 1;
            }
            30% {
                /* Hover perfectly vertical over the hole */
                transform: translate(85px, -10px) rotate(90deg);
                opacity: 1;
            }
            40% {
                /* Drop straight down into the hole */
                transform: translate(85px, 150px) rotate(90deg);
                opacity: 1;
            }
            41%, 50% {
                transform: translate(0, -200px) rotate(0deg);
                opacity: 0;
            }
            51%, 65% {
                transform: translate(0, -200px) rotate(0deg);
                opacity: 1;
            }
            85% {
                transform: translate(0, 0) rotate(0deg);
            }
            90% {
                transform: translate(0, 4px) scaleY(0.8) scaleX(1.05);
            }
            95%, 100% {
                transform: translate(0, 0) scaleY(1) scaleX(1);
            }
        }
    </style>
    <div id="page-loader" class="page-loader-overlay">
        <div class="loader-scene">
            <div class="loader-hole-back"></div>
            <div class="loader-floor-mask"></div>
            <div class="loader-hole-front"></div>
            <div class="loader-bed-headboard"></div>
            <div class="loader-bed"></div>
            <div class="loader-mattress mattress-1"></div>
            <div class="loader-mattress mattress-2"></div>
        </div>
    </div>
    <script>
        (function() {
            var loaderTimeout = setTimeout(function() {
                var loader = document.getElementById('page-loader');
                if (loader) loader.classList.add('active');
            }, 500); // 500ms threshold for fast connections

            window.addEventListener('load', function() {
                clearTimeout(loaderTimeout);
                var loader = document.getElementById('page-loader');
                if (loader) loader.classList.remove('active');
            });
        })();
    </script>

    <!-- Auth Section -->
    <div id="auth-section" class="auth-section active-section">

            <div id="auth-status" class="status-msg"></div>
            <form id="auth-form">

                    <div>

                    </div>
                    <div>
                        <label for="signup-lname">Last Name</label>

                    </div>
                </div>
                <div class="input-group">

                        <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0;" aria-label="Toggle password visibility">👁️</button>

                <!-- Anti-Bot Honeypot -->

<script>
    let supabaseClient = null;
    let isLogin = true;
    let currentUser = null;
    let currentSession = null;

    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const authForm = document.getElementById('auth-form');
    const toggleAuth = document.getElementById('toggle-auth');
    const authTitle = document.getElementById('auth-title');
    const authBtn = document.getElementById('auth-btn');

    async function initApp() {
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000/api' 
            : 'https://restienestie.onrender.com/api';
        try {
            const res = await fetch(`${API_BASE}/public-config`);
            const config = await res.json();
            supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
            
            // Check Auth State
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    handleSession(session);
                }
            });

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN') {
                    handleSession(session);
                } else if (event === 'SIGNED_OUT') {
                    handleSession(null);
                }
            });
        } catch(e) {
            console.error('Failed to load config', e);
        }
    }
    initApp();

    document.getElementById('toggle-password').addEventListener('click', () => {
        const passInput = document.getElementById('password');
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        document.getElementById('toggle-password').textContent = isPass ? '🙈' : '👁️';
    });

    function showAuthStatus(message, type) {
        const statusEl = document.getElementById('auth-status');
        statusEl.textContent = message;
        statusEl.className = `status-msg status-${type}`;
        statusEl.style.display = 'block';
    }

    function showProfileStatus(message, type) {
        const statusEl = document.getElementById('profile-status');
        if (!statusEl) return;
        statusEl.textContent = message;
        statusEl.className = `status-msg status-${type}`;
        statusEl.style.display = 'block';
        setTimeout(() => {
            statusEl.style.display = 'none';
        }, 5000);
    }

    // Auth State and Listeners are now inside initApp

    function handleSession(session) {
        if(session) {
            isLogin = false;
            currentUser = session.user;
            currentSession = session;
            authSection.classList.remove('active-section');
            dashboardSection.classList.add('active-section');
            
            const accountLink = document.getElementById('account-link');
            if (accountLink) {
                accountLink.innerHTML = accountLink.innerHTML.replace('ACCOUNT', 'YOU');
            }

            fetchProfile();
            fetchOrders();
        } else {
            currentUser = null;
            currentSession = null;
            authSection.classList.add('active-section');
            dashboardSection.classList.remove('active-section');
            
            const accountLink = document.getElementById('account-link');
            if (accountLink) {
                accountLink.innerHTML = accountLink.innerHTML.replace('YOU', 'ACCOUNT');
            }
        }
    }

    // Toggle Login/Signup
    toggleAuth.addEventListener('click', () => {
        isLogin = !isLogin;
        authTitle.textContent = isLogin ? 'Sign In' : 'Sign Up';
        authBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
        toggleAuth.textContent = isLogin ? 'Need an account? Sign Up' : 'Already have an account? Sign In';
        document.getElementById('name-group').style.display = isLogin ? 'none' : 'grid';
        
        // Hide google/apple login on signup to keep it simple, or leave them. Let's leave them.
        const statusEl = document.getElementById('auth-status');
        statusEl.style.display = 'none';
    });

    // Handle Auth Submit
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('auth-status');
        statusEl.style.display = 'none';
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!supabaseClient) {
            showAuthStatus('Initializing authentication... please wait', 'loading');
            return;
        }

        if (!isLogin) {
            const honeypot = document.getElementById('honeypot').value;
            if (honeypot) {
                // Bot detected
                showAuthStatus('Bot detected. Sign up denied.', 'error');
                return;
            }
        }

        showAuthStatus(isLogin ? 'Signing in...' : 'Signing up...', 'loading');

        let error;
        if (isLogin) {
            const res = await supabaseClient.auth.signInWithPassword({ email, password });
            error = res.error;
            if (!error) showAuthStatus('Signed in successfully!', 'success');
        } else {
            const fname = document.getElementById('signup-fname').value.trim();
            const lname = document.getElementById('signup-lname').value.trim();
            const first_name = fname + (lname ? ' ' + lname : '');
            
            const res = await supabaseClient.auth.signUp({ 
                email, 
                password,
                options: {
                    data: {
                        first_name: first_name
                    }
                }
            });
            error = res.error;
            if(!error && res.data.user && !res.data.session) {
                showAuthStatus('Please check your email for a confirmation link.', 'success');
                return;
            } else if (!error) {
                showAuthStatus('Signed up successfully!', 'success');
            }
        }

        if (error) {
            showAuthStatus(error.message, 'error');
        }
    });

    // Handle Google Login
    document.getElementById('google-login').addEventListener('click', async () => {
        await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/account.html' }
        });
    });

    // Handle Apple Login
    document.getElementById('apple-login').addEventListener('click', async () => {
        await supabaseClient.auth.signInWithOAuth({
            provider: 'apple',
            options: { redirectTo: window.location.origin + '/account.html' }
        });
    });

    // Handle Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
    });

    // Fetch Backend Data
    async function fetchProfile() {
        if(!currentSession) return;
        try {
            const res = await fetch('http://localhost:3000/api/my-profile', {
                headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
            });
            const data = await res.json();
            if(data.success && data.profile) {
                if(data.profile.first_name) {
                    const parts = data.profile.first_name.split(' ');
                    document.getElementById('prof-fname').value = parts[0] || '';
                    document.getElementById('prof-lname').value = parts.slice(1).join(' ') || '';
                }
                document.getElementById('prof-phone').value = data.profile.phone || '';
            }
        } catch(e) { console.error(e); }
    }

    let allOrders = [];
    let showingAll = false;

    async function fetchOrders() {
        if(!currentSession) return;
        try {
            const res = await fetch('http://localhost:3000/api/my-orders', {
                headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
            });
            const data = await res.json();
            if(data.success && data.orders) {
                allOrders = data.orders.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                renderOrders();
            }
        } catch(e) { console.error(e); }
    }

    function renderOrders() {
        const list = document.getElementById('orders-list');
        const btn = document.getElementById('view-all-orders-btn');
        if(allOrders.length === 0) {
            list.innerHTML = '<p style="color: #666; font-family: \'Inter\', sans-serif;">You haven\'t placed any orders yet.</p>';
            btn.style.display = 'none';
            return;
        }
        
        let displayOrders = showingAll ? allOrders : allOrders.slice(0, 5);
        if (allOrders.length > 5) {
            btn.style.display = 'block';
            btn.textContent = showingAll ? 'Show Recent 5' : 'See All Orders';
        } else {
            btn.style.display = 'none';
        }

        list.innerHTML = displayOrders.map(o => `
            <div class="order-item">
                <div class="order-header">
                    <strong style="color: #4B3621; font-family: 'Inter', sans-serif; font-weight: 600;">Order #${o.id.substring(0, 8)}</strong>
                    <span class="order-status" style="background: ${o.status === 'Shipped' ? '#d4edda' : '#eee'}; color: ${o.status === 'Shipped' ? '#155724' : '#333'};">${o.status || 'Placed'}</span>
                </div>
                <div style="font-size: 0.9rem; color: #666; font-family: 'Inter', sans-serif; line-height: 1.5;">
                    <div><strong>Date:</strong> ${new Date(o.created_at).toLocaleDateString()}</div>
                    <div><strong>Total:</strong> ₹${o.total_amount}</div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('view-all-orders-btn').addEventListener('click', () => {
        showingAll = !showingAll;
        renderOrders();
    });

    // Update Profile
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fname = document.getElementById('prof-fname').value.trim();
        const lname = document.getElementById('prof-lname').value.trim();
        const first_name = fname + (lname ? ' ' + lname : '');
        const phone = document.getElementById('prof-phone').value;
        
        showProfileStatus('Saving changes...', 'loading');

        try {
            const res = await fetch('http://localhost:3000/api/my-profile', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${currentSession.access_token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ first_name, phone })
            });
            
            if (res.ok) {
                showProfileStatus('Profile updated successfully!', 'success');
            } else {
                showProfileStatus('Failed to update profile.', 'error');
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            const originalBg = btn.style.backgroundColor;
            btn.textContent = 'Saved!';
            btn.style.backgroundColor = '#28a745';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = originalBg;
            }, 2000);
        } catch(e) { 
            console.error(e); 
            showProfileStatus('Network error. Please try again.', 'error');
        }
    });
</script>
</body>
</html>
